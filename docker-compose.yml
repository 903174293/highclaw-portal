version: '3.8'

services:
  # Next.js 应用
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: highclaw-portal-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # 添加你的环境变量
      # - DATABASE_URL=your-database-url
      # - API_KEY=your-api-key
    volumes:
      # 可选：挂载日志目录
      - ./logs:/app/logs
    networks:
      - highclaw-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: highclaw-portal-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-sites:/etc/nginx/sites-available:ro
      - ./ssl:/etc/nginx/ssl:ro  # SSL 证书目录
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - app
    networks:
      - highclaw-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  highclaw-network:
    driver: bridge

volumes:
  app-logs:
    driver: local
  nginx-logs:
    driver: local

