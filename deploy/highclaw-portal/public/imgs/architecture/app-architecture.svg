<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 950" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080d14"/>
      <stop offset="100%" stop-color="#0f1520"/>
    </linearGradient>
    <linearGradient id="agentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a2a"/>
      <stop offset="100%" stop-color="#0e2236"/>
    </linearGradient>
    <linearGradient id="memGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a2e"/>
      <stop offset="100%" stop-color="#150e36"/>
    </linearGradient>
    <marker id="arrowCyanMain" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#00e5ff"/></marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#f59e0b"/></marker>
    <marker id="arrowCyan" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#06d6d6"/></marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#c084fc"/></marker>
    <marker id="arrowViolet" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#8b5cf6"/></marker>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1100" height="950" rx="12" fill="url(#bgGrad)"/>
  <g stroke="#0e2a3a" stroke-width="0.3" opacity="0.4">
    <line x1="0" y1="200" x2="1100" y2="200"/><line x1="0" y1="400" x2="1100" y2="400"/>
    <line x1="0" y1="600" x2="1100" y2="600"/><line x1="0" y1="800" x2="1100" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="950"/><line x1="400" y1="0" x2="400" y2="950"/>
    <line x1="600" y1="0" x2="600" y2="950"/><line x1="800" y1="0" x2="800" y2="950"/>
  </g>

  <text x="550" y="38" text-anchor="middle" fill="#00e5ff" font-size="22" font-weight="700" filter="url(#glowCyan)">HighClaw Application Architecture</text>
  <text x="550" y="58" text-anchor="middle" fill="#5a7a8a" font-size="12">Lightweight, stable, multi-channel AI assistant infrastructure</text>

  <!-- LEFT: Client Surfaces -->
  <rect x="20" y="80" width="180" height="290" rx="10" fill="#0a1520" stroke="#00b8d4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="110" y="105" text-anchor="middle" fill="#00e5ff" font-size="13" font-weight="600">Client Surfaces</text>

  <rect x="35" y="120" width="150" height="24" rx="6" fill="#0e1e2e"/>
  <text x="110" y="137" text-anchor="middle" fill="#4dd0e1" font-size="10">Web / WebChat</text>
  <rect x="35" y="150" width="150" height="24" rx="6" fill="#0e1e2e"/>
  <text x="110" y="167" text-anchor="middle" fill="#4dd0e1" font-size="10">PC App (future)</text>
  <rect x="35" y="180" width="150" height="24" rx="6" fill="#0e1e2e"/>
  <text x="110" y="197" text-anchor="middle" fill="#4dd0e1" font-size="10">Mobile App (future)</text>
  <rect x="35" y="210" width="150" height="24" rx="6" fill="#0e1e2e"/>
  <text x="110" y="227" text-anchor="middle" fill="#4dd0e1" font-size="10">CLI / TUI</text>

  <text x="110" y="255" text-anchor="middle" fill="#5a7a8a" font-size="9" font-style="italic">Direct runtime access</text>

  <line x1="200" y1="220" x2="230" y2="220" stroke="#00b8d4" stroke-width="2" marker-end="url(#arrowCyanMain)"/>

  <!-- LEFT-BOTTOM: Chat Channels -->
  <rect x="20" y="390" width="180" height="210" rx="10" fill="#0a1520" stroke="#00b8d4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="110" y="415" text-anchor="middle" fill="#00e5ff" font-size="13" font-weight="600">Chat Channels</text>
  <rect x="35" y="430" width="150" height="22" rx="6" fill="#0e1e2e"/>
  <text x="110" y="445" text-anchor="middle" fill="#4dd0e1" font-size="9">Telegram / Discord / Slack</text>
  <rect x="35" y="458" width="150" height="22" rx="6" fill="#0e1e2e"/>
  <text x="110" y="473" text-anchor="middle" fill="#4dd0e1" font-size="9">WhatsApp / Feishu / WeCom</text>
  <rect x="35" y="486" width="150" height="22" rx="6" fill="#0e1e2e"/>
  <text x="110" y="501" text-anchor="middle" fill="#4dd0e1" font-size="9">WeChat / DingTalk (plan)</text>
  <rect x="35" y="514" width="150" height="22" rx="6" fill="#0e1e2e"/>
  <text x="110" y="529" text-anchor="middle" fill="#4dd0e1" font-size="9">Webhook / API</text>

  <text x="110" y="560" text-anchor="middle" fill="#5a7a8a" font-size="9" font-style="italic">Unified routing + policies</text>

  <line x1="200" y1="495" x2="230" y2="495" stroke="#00b8d4" stroke-width="2" marker-end="url(#arrowCyanMain)"/>

  <!-- CENTER-LEFT: Gateway -->
  <rect x="230" y="80" width="260" height="520" rx="12" fill="#0a1520" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="360" y="105" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="600">Gateway Control Plane</text>

  <rect x="250" y="125" width="220" height="48" rx="8" fill="#1a1708" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="360" y="145" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">Auth + Pairing</text>
  <text x="360" y="160" text-anchor="middle" fill="#a8a29e" font-size="8">OTP, allowlists, tokens</text>

  <rect x="250" y="180" width="220" height="48" rx="8" fill="#1a1708" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="360" y="200" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">Session Routing</text>
  <text x="360" y="215" text-anchor="middle" fill="#a8a29e" font-size="8">per-sender + binding</text>

  <rect x="250" y="235" width="220" height="48" rx="8" fill="#1a1708" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="360" y="255" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">Rate + Cost Guard</text>
  <text x="360" y="270" text-anchor="middle" fill="#a8a29e" font-size="8">limits + quotas</text>

  <rect x="250" y="290" width="220" height="48" rx="8" fill="#1a1708" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="360" y="310" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">Media Pipeline</text>
  <text x="360" y="325" text-anchor="middle" fill="#a8a29e" font-size="8">image/video/doc/emoji</text>

  <rect x="250" y="345" width="220" height="48" rx="8" fill="#1a1708" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="360" y="365" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">Observability</text>
  <text x="360" y="380" text-anchor="middle" fill="#a8a29e" font-size="8">task log + metrics</text>

  <rect x="250" y="400" width="220" height="48" rx="8" fill="#1a1708" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="360" y="420" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">Gateway API</text>
  <text x="360" y="435" text-anchor="middle" fill="#a8a29e" font-size="8">/pair /webhook /health</text>

  <line x1="490" y1="300" x2="520" y2="300" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- CENTER: Agent Core -->
  <rect x="520" y="250" width="560" height="160" rx="12" fill="url(#agentGrad)" stroke="#00e5ff" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="800" y="275" text-anchor="middle" fill="#00e5ff" font-size="14" font-weight="700" filter="url(#glowCyan)">Agent Runtime</text>

  <rect x="540" y="295" width="120" height="42" rx="8" fill="#081a2a" stroke="#00b8d4" stroke-width="1"/>
  <text x="600" y="313" text-anchor="middle" fill="#00e5ff" font-size="10" font-weight="600">Session</text>
  <text x="600" y="330" text-anchor="middle" fill="#4dd0e1" font-size="12">Context</text>

  <rect x="680" y="295" width="120" height="42" rx="8" fill="#081a2a" stroke="#00b8d4" stroke-width="1"/>
  <text x="740" y="313" text-anchor="middle" fill="#00e5ff" font-size="10" font-weight="600">Memory</text>
  <text x="740" y="330" text-anchor="middle" fill="#4dd0e1" font-size="12">Recall</text>

  <rect x="820" y="295" width="120" height="42" rx="8" fill="#081a2a" stroke="#00b8d4" stroke-width="1"/>
  <text x="880" y="313" text-anchor="middle" fill="#00e5ff" font-size="10" font-weight="600">LLM</text>
  <text x="880" y="330" text-anchor="middle" fill="#4dd0e1" font-size="12">Inference</text>

  <rect x="960" y="295" width="100" height="42" rx="8" fill="#081a2a" stroke="#00b8d4" stroke-width="1"/>
  <text x="1010" y="313" text-anchor="middle" fill="#00e5ff" font-size="10" font-weight="600">Tools</text>
  <text x="1010" y="330" text-anchor="middle" fill="#4dd0e1" font-size="12">Exec</text>

  <line x1="660" y1="316" x2="680" y2="316" stroke="#00e5ff" stroke-width="1.5" marker-end="url(#arrowCyanMain)"/>
  <line x1="800" y1="316" x2="820" y2="316" stroke="#00e5ff" stroke-width="1.5" marker-end="url(#arrowCyanMain)"/>
  <line x1="940" y1="316" x2="960" y2="316" stroke="#00e5ff" stroke-width="1.5" marker-end="url(#arrowCyanMain)"/>

  <!-- RIGHT: Providers -->
  <rect x="520" y="80" width="560" height="140" rx="10" fill="#0a1520" stroke="#00e5ff" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="800" y="105" text-anchor="middle" fill="#00e5ff" font-size="13" font-weight="600" filter="url(#glowCyan)">Model Providers</text>
  <text x="800" y="120" text-anchor="middle" fill="#5a7a8a" font-size="9">OpenAI-compatible + custom URL</text>

  <rect x="540" y="135" width="110" height="22" rx="5" fill="#081a2a"/>
  <text x="595" y="151" text-anchor="middle" fill="#4dd0e1" font-size="9">OpenAI</text>
  <rect x="655" y="135" width="110" height="22" rx="5" fill="#081a2a"/>
  <text x="710" y="151" text-anchor="middle" fill="#4dd0e1" font-size="9">Anthropic</text>
  <rect x="770" y="135" width="110" height="22" rx="5" fill="#081a2a"/>
  <text x="825" y="151" text-anchor="middle" fill="#4dd0e1" font-size="9">OpenRouter</text>
  <rect x="885" y="135" width="110" height="22" rx="5" fill="#081a2a"/>
  <text x="940" y="151" text-anchor="middle" fill="#4dd0e1" font-size="9">Gemini</text>
  <rect x="1000" y="135" width="60" height="22" rx="5" fill="#0a2a3a" stroke="#00e5ff" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="1030" y="151" text-anchor="middle" fill="#00e5ff" font-size="9" font-weight="600">URL</text>

  <line x1="800" y1="220" x2="800" y2="250" stroke="#00e5ff" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

  <!-- BOTTOM: Memory + Tools + Plugins -->
  <rect x="20" y="630" width="530" height="200" rx="10" fill="url(#memGrad)" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="285" y="655" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="700">Memory & Search</text>
  <text x="285" y="672" text-anchor="middle" fill="#5a7a8a" font-size="9">FTS5 + vector hybrid, high-accuracy recall</text>

  <rect x="35" y="685" width="245" height="24" rx="5" fill="#120e2e" stroke="#8b5cf6" stroke-width="0.5"/>
  <text x="45" y="702" fill="#c4b5fd" font-size="9" font-weight="600">Vector</text>
  <text x="157" y="702" text-anchor="middle" fill="#a78bfa" font-size="8">embedding + cosine</text>

  <rect x="290" y="685" width="245" height="24" rx="5" fill="#120e2e" stroke="#8b5cf6" stroke-width="0.5"/>
  <text x="300" y="702" fill="#c4b5fd" font-size="9" font-weight="600">Keyword</text>
  <text x="412" y="702" text-anchor="middle" fill="#a78bfa" font-size="8">FTS5 + BM25</text>

  <rect x="35" y="715" width="500" height="24" rx="5" fill="#120e2e" stroke="#8b5cf6" stroke-width="0.5"/>
  <text x="285" y="731" text-anchor="middle" fill="#a78bfa" font-size="8">Hybrid merge, reindex, retention, archive</text>

  <line x1="600" y1="410" x2="280" y2="630" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrowViolet)"/>

  <rect x="570" y="630" width="250" height="200" rx="10" fill="#0a1520" stroke="#06d6d6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="695" y="655" text-anchor="middle" fill="#67e8f9" font-size="13" font-weight="600">Tools & Skills</text>
  <text x="695" y="672" text-anchor="middle" fill="#5a7a8a" font-size="9">browser / cron / files / skills</text>
  <text x="695" y="695" text-anchor="middle" fill="#22d3ee" font-size="9">Skill install + workspace skills</text>
  <text x="695" y="715" text-anchor="middle" fill="#22d3ee" font-size="9">Plugin SDK + custom integrations</text>
  <text x="695" y="735" text-anchor="middle" fill="#22d3ee" font-size="9">Automation hooks + webhooks</text>
  <text x="695" y="755" text-anchor="middle" fill="#22d3ee" font-size="9">Security approvals</text>

  <line x1="870" y1="410" x2="695" y2="630" stroke="#06d6d6" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

  <rect x="840" y="630" width="240" height="200" rx="10" fill="#0a1520" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="960" y="655" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="600">Governance</text>
  <text x="960" y="678" text-anchor="middle" fill="#ef4444" font-size="9">sandbox policy + approvals</text>
  <text x="960" y="698" text-anchor="middle" fill="#ef4444" font-size="9">rate limit + cost cap</text>
  <text x="960" y="718" text-anchor="middle" fill="#ef4444" font-size="9">audit log + diagnostics</text>
  <text x="960" y="738" text-anchor="middle" fill="#ef4444" font-size="9">high availability defaults</text>

  <line x1="1010" y1="410" x2="960" y2="630" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

  <text x="550" y="920" text-anchor="middle" fill="#5a7a8a" font-size="10">Single binary  |  multi-channel  |  high availability  |  fast deployment</text>
</svg>
